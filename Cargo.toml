[package]
name = "sudo-frei"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Time-limited passwordless sudo on your own Linux machines, with a TUI"

[dependencies]
chrono = "0.4.45"
libc = "0.2.191"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.0"
